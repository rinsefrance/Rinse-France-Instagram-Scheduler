name: Instagram Scheduler

on:
  schedule:
    # Exécution automatique toutes les heures (ex: 10h, 11h, 12h, ..., 17h)
    - cron: "0 * * * *"
  workflow_dispatch: # Permet de déclencher un test manuel depuis GitHub sans attendre l'heure pile

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pytz toml

      - name: Injection des secrets Streamlit
        env:
          SECRETS_CONTENT: ${{ secrets.STREAMLIT_SECRETS }}
        run: |
          mkdir -p .streamlit
          echo "$SECRETS_CONTENT" > .streamlit/secrets.toml

      - name: Exécution du script de publication
        run: python auto_publish.py