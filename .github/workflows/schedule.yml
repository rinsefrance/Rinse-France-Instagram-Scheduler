name: Instagram Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pytz toml

      - name: Injection des secrets Streamlit
        run: |
          mkdir -p .streamlit
          cat << 'EOF' > .streamlit/secrets.toml
          ${{ secrets.STREAMLIT_SECRETS }}
          EOF

      - name: Exécution du script de publication
        run: python publish_cron.py